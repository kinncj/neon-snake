<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Neo-retro 2D 8-bit neon snake — a lo-fi CRT arcade." />
    <title>NEON SNAKE</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
