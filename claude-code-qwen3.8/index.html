<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Neo-retro 2D 8-bit neon snake — a lo-fi CRT arcade." />
    <title>NEON SNAKE</title>
    <style>
      :root {
        /* The TV bezel thickness. Responsive: thin on phones, chunky on desktops. */
        --bezel: clamp(14px, 3vw, 34px);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* The CRT television fills the viewport. The glass (#screen) is inset by the
         bezel, so the playfield renders INSIDE the frame — never under it. */
      #tv {
        position: fixed;
        inset: 0;
      }
      #screen {
        position: absolute;
        inset: var(--bezel);
        background: #000;
        border-radius: 10px;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* The bezel: a solid ring (the physical TV frame) painted over the viewport
         edge. z-40, pointer-events none, with a hairline glass-edge highlight. It
         occupies only the bezel band, so it never covers the playfield. P4.2: a
         lighter, more defined plastic frame (a readable TV, not a flat box) — the
         highlight is a light bevel (never a darkening), and the real detailed
         frame is the SVG sprite in P4.3. */
      #tv-frame {
        position: absolute;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        border: var(--bezel) solid #21212e;
        border-radius: 26px;
        box-shadow: inset 0 0 0 2px rgba(160, 180, 255, 0.13);
      }
      /* The breathing power LED on the bottom of the bezel. */
      #tv-led {
        position: absolute;
        left: 50%;
        bottom: calc(var(--bezel) * 0.5);
        transform: translateX(-50%);
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #35e08a;
        box-shadow: 0 0 6px 1px rgba(53, 224, 138, 0.8);
        z-index: 41;
        pointer-events: none;
        animation: tvled 3.2s ease-in-out infinite;
      }
      @keyframes tvled {
        0%,
        100% {
          opacity: 0.45;
          box-shadow: 0 0 4px 0 rgba(53, 224, 138, 0.4);
        }
        50% {
          opacity: 1;
          box-shadow: 0 0 9px 2px rgba(53, 224, 138, 0.9);
        }
      }
      /* The on-screen d-pad (touch.ts owns its buttons + neon styling + display).
         P4.2: docks LEFT in landscape (the playfield's natural thumb-pad rest),
         and moves to the RIGHT in portrait so it clears the centred playfield. */
      #dpad {
        position: fixed;
        left: calc(var(--bezel) + 18px);
        bottom: calc(var(--bezel) + 18px);
        z-index: 50;
      }
      @media (orientation: portrait) {
        #dpad {
          left: auto;
          right: calc(var(--bezel) + 18px);
        }
      }
    </style>
  </head>
  <body>
    <div id="tv">
      <div id="screen">
        <div id="stage"></div>
      </div>
      <div id="tv-frame"></div>
      <div id="tv-led"></div>
    </div>
    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
