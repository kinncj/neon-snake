<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>NEON SNAKE</title>
  </head>
  <body>
    <div id="tv">
      <div id="screen">
        <canvas id="display" aria-label="game"></canvas>
        <canvas id="fx" aria-hidden="true"></canvas>
        <div id="hud"></div>
        <div id="overlay"></div>
        <footer id="footer"><span id="build"></span></footer>
      </div>
      <div id="tv-frame" aria-hidden="true"></div>
      <div id="tv-led" aria-hidden="true"></div>
      <div id="ui-top"></div>
      <button id="mute" type="button" data-i18n="sound" data-i18n-attr="aria-label,title" aria-label="Sound on/off (M)" aria-pressed="false" title="Sound on/off (M)">&#9834;</button>
    </div>
    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
